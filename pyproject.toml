[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "undoable"
version = "0.1.0"
description = "Safety net for autonomous AI coding agents: prevent dangerous actions, undo mistakes, check packages, stop runaway sessions, and report what happened."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
undoable = "undoable.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["undoable"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
